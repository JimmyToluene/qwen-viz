# Static viewer, bound to localhost. `tailscale serve` publishes it on the tailnet only.
services:
  qwen-viz:
    image: nginx:alpine
    container_name: qwen-viz
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:8096:80"
    volumes:
      - ../out:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
