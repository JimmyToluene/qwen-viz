server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/octet-stream application/json application/javascript text/css image/svg+xml;
    # Rebuilds change the traces, so revalidate; Next's hashed assets can be cached for good.
    location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }
    types { application/octet-stream bin; application/json json; application/javascript js; text/css css; text/html html; image/png png; text/plain txt; }
}
